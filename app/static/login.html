<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1b2d">
<title>Campus Booking — Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <h1>Campus Facility Booking</h1>

  <div class="tabs">
    <button id="tab-login" class="active" onclick="showTab('login')">Login</button>
    <button id="tab-register" onclick="showTab('register')">Register</button>
  </div>

  <div id="error" class="error" style="display:none"></div>

  <form id="login-form">
    <div class="field">
      <label>Institute email</label>
      <input type="email" id="login-email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" required>
    </div>
    <button class="btn" type="submit">Log in</button>
  </form>

  <form id="register-form" style="display:none">
    <div class="field">
      <label>Institute email</label>
      <input type="email" id="reg-email" required>
    </div>
    <div class="field">
      <label>Full name</label>
      <input type="text" id="reg-name" required>
    </div>
    <div class="field">
      <label>Roll number</label>
      <input type="text" id="reg-roll" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="reg-password" required minlength="8">
    </div>
    <button class="btn" type="submit">Create account</button>
  </form>
</main>

<script src="js/api.js"></script>
<script>
  if (getToken()) location.href = "facilities.html";

  function showTab(which) {
    document.getElementById("tab-login").classList.toggle("active", which === "login");
    document.getElementById("tab-register").classList.toggle("active", which === "register");
    document.getElementById("login-form").style.display = which === "login" ? "block" : "none";
    document.getElementById("register-form").style.display = which === "register" ? "block" : "none";
    hideError();
  }

  function showError(msg) {
    const el = document.getElementById("error");
    el.textContent = msg;
    el.style.display = "block";
  }
  function hideError() {
    document.getElementById("error").style.display = "none";
  }

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideError();
    try {
      await login(
        document.getElementById("login-email").value,
        document.getElementById("login-password").value
      );
      location.href = "facilities.html";
    } catch (err) {
      showError(err.message);
    }
  });

  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideError();
    try {
      await api("/users/", {
        method: "POST",
        body: {
          email: document.getElementById("reg-email").value,
          full_name: document.getElementById("reg-name").value,
          roll_number: document.getElementById("reg-roll").value,
          password: document.getElementById("reg-password").value,
        },
      });
      await login(
        document.getElementById("reg-email").value,
        document.getElementById("reg-password").value
      );
      location.href = "facilities.html";
    } catch (err) {
      showError(err.message);
    }
  });
</script>
</body>
</html>
